<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JPG转BMP转换器</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 30px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }
        input[type="text"] {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s, box-shadow 0.3s;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }
        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }
        button:active {
            transform: translateY(0);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .result {
            margin-top: 25px;
            padding: 20px;
            border-radius: 10px;
            display: none;
        }
        .result.success {
            background: #e8f5e9;
            border: 1px solid #c8e6c9;
        }
        .result.error {
            background: #ffebee;
            border: 1px solid #ffcdd2;
        }
        .result.show {
            display: block;
        }
        .result p {
            margin: 0;
            color: #333;
        }
        .result.error p {
            color: #c62828;
        }
        .download-link {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 500;
            transition: background 0.3s;
        }
        .download-link:hover {
            background: #5a6fd6;
        }
        .preview-section {
            margin-top: 25px;
            display: none;
        }
        .preview-section.show {
            display: block;
        }
        .preview-title {
            margin-bottom: 15px;
            color: #555;
            font-weight: 500;
        }
        .preview-wrapper {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .preview-box {
            text-align: center;
        }
        .preview-box img {
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            max-width: 176px;
            max-height: 220px;
        }
        .preview-label {
            margin-top: 10px;
            font-size: 14px;
            color: #666;
        }
        .info {
            margin-top: 20px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 8px;
            font-size: 14px;
            color: #666;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>JPG转BMP转换器</h1>
        
        <div class="input-group">
            <label for="imageUrl">JPG图片网址</label>
            <input type="text" id="imageUrl" placeholder="请输入JPG图片的URL地址...">
        </div>
        
        <button id="convertBtn" onclick="convertImage()">
            <span id="btnText">开始转换</span>
            <span id="btnLoading" class="loading" style="display: none;"></span>
        </button>
        
        <div class="preview-section" id="previewSection">
            <div class="preview-title">图片预览</div>
            <div class="preview-wrapper">
                <div class="preview-box">
                    <img id="originalImg" alt="原图" />
                    <div class="preview-label">原图</div>
                </div>
                <div class="preview-box">
                    <img id="convertedImg" alt="转换后" />
                    <div class="preview-label">176x220 BMP</div>
                </div>
            </div>
        </div>
        
        <div class="result" id="result"></div>
        
        <div class="info">
            <strong>说明：</strong>
            <ul style="margin: 10px 0 0 20px; padding: 0;">
                <li>支持输入JPG/JPEG格式的图片URL</li>
                <li>输出格式：176x220像素，16位真彩色BMP</li>
                <li>转换后的图片保存在服务器的uploads目录中</li>
            </ul>
        </div>
    </div>

    <script>
        async function convertImage() {
            const urlInput = document.getElementById('imageUrl');
            const url = urlInput.value.trim();
            const convertBtn = document.getElementById('convertBtn');
            const btnText = document.getElementById('btnText');
            const btnLoading = document.getElementById('btnLoading');
            const result = document.getElementById('result');
            const previewSection = document.getElementById('previewSection');
            
            if (!url) {
                showResult('请输入图片URL', 'error');
                return;
            }
            
            // 清空输入框
            urlInput.value = '';
            
            // 显示加载状态
            convertBtn.disabled = true;
            btnText.style.display = 'none';
            btnLoading.style.display = 'inline-block';
            result.classList.remove('show');
            previewSection.classList.remove('show');
            
            try {
                const response = await fetch('/convert', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ imageUrl: url })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    // 显示原图预览
                    document.getElementById('originalImg').src = url;
                    // 显示转换后预览（BMP）
                    document.getElementById('convertedImg').src = data.downloadUrl;
                    previewSection.classList.add('show');
                    
                    showResult(`
                        <p>图片转换成功！</p>
                        <p>文件名：${data.filename}</p>
                        <a href="${data.downloadUrl}" download="${data.filename}" class="download-link">下载BMP图片</a>
                    `, 'success');
                } else {
                    showResult(data.error || '转换失败', 'error');
                }
            } catch (error) {
                showResult('请求失败：' + error.message, 'error');
            } finally {
                // 恢复按钮状态
                convertBtn.disabled = false;
                btnText.style.display = 'inline';
                btnLoading.style.display = 'none';
            }
        }
        
        function showResult(message, type) {
            const result = document.getElementById('result');
            result.innerHTML = message;
            result.className = 'result ' + type + ' show';
        }
    </script>
</body>
</html>
